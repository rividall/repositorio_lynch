<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronics Workshop Poster</title>
  <style>
    /* =====================================================
       ELECTRONICS WORKSHOP POSTER - STYLE GUIDE
       =====================================================
       
       COLOR PALETTE
       -------------
       BASE COLORS (Deep Navy/Slate):
         - Darkest:  #0a0f1a (body background)
         - Dark:     #0d1321 (poster gradient start)
         - Medium:   #1a2332, #162033 (poster gradient midtones)
         - Light:    #0f1a2b (poster gradient accent)
       
       ACCENT COLORS (The "pop" colors):
         - Cyan:     #38bdf8 (primary accent - LED/tech feel)
         - Purple:   #a78bfa (secondary accent - creative touch)
         - Mint:     #34d399 (tertiary accent - success/go)
       
       TEXT COLORS:
         - Primary:  #e2e8f0 (main content text)
         - Muted:    #64748b (subtitles, secondary text)
         - Dim:      #475569 (placeholder text)
         - Faint:    #334155 (icons, disabled states)
       
       TRANSPARENCY GUIDE:
         - Use rgba() with these accents for glows/overlays
         - Typical opacities: 0.1 (subtle), 0.2-0.3 (visible), 0.5+ (prominent)
       
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY: The outermost background - darkest base color */
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0f1a; /* BASE: Darkest navy - the "void" behind the poster */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* POSTER CONTAINER: Main card with gradient background
       - Gradient flows from top-left to bottom-right (145deg)
       - Uses base colors to create depth */
    .poster {
      position: relative;
      width: 100%;
      max-width: 800px;        /* DIMENSION: Poster max width - adjust for different sizes */
      min-height: 1000px;      /* DIMENSION: Poster min height - adjust as needed */
      background: linear-gradient(
        145deg,                 /* GRADIENT ANGLE: Change for different flow direction */
        #0d1321 0%,            /* BASE: Darkest point */
        #1a2332 25%,           /* BASE: Slightly lighter */
        #0f1a2b 50%,           /* BASE: Mid-dark */
        #162033 75%,           /* BASE: Lighter dark */
        #0d1524 100%           /* BASE: Back to dark */
      );
      border-radius: 24px;     /* SHAPE: Corner roundness */
      overflow: hidden;
      box-shadow: 
        0 25px 80px rgba(0, 0, 0, 0.5),           /* Shadow: Depth/elevation */
        0 0 0 1px rgba(255, 255, 255, 0.05),      /* Border: Subtle outline */
        inset 0 1px 0 rgba(255, 255, 255, 0.05); /* Highlight: Top edge shine */
    }

    /* SVG BACKGROUND: Contains all the circuit patterns
       - Positioned absolutely to sit behind content
       - Opacity controls overall visibility of pattern */
    .svg-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.6; /* VISIBILITY: Increase for more prominent pattern, decrease for subtler */
    }

    /* GRADIENT OVERLAY: Colored light effects on top of SVG
       - Creates the subtle color "glow" spots
       - Each radial-gradient is a separate light source */
    .gradient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        /* ACCENT GLOW: Cyan light - top left area */
        radial-gradient(ellipse at 20% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        /* ACCENT GLOW: Purple light - bottom right area */
        radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.06) 0%, transparent 50%),
        /* ACCENT GLOW: Mint light - left side */
        radial-gradient(ellipse at 0% 60%, rgba(52, 211, 153, 0.04) 0%, transparent 40%);
      pointer-events: none;
    }

    /* CONTENT WRAPPER: Where the actual poster content lives
       - z-index ensures it's above the background elements */
    .content {
      position: relative;
      z-index: 10;
      padding: 3rem; /* SPACING: Inner padding - adjust for more/less breathing room */
      color: #e2e8f0; /* TEXT: Primary text color */
    }

    /* HEADER SECTION: Title area at the top */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* MAIN TITLE: Gradient text effect
       - Uses all three accent colors for rainbow effect */
    .header h1 {
      font-size: 2.5rem;       /* TYPOGRAPHY: Title size */
      font-weight: 700;
      /* ACCENT GRADIENT: Flows through cyan → purple → mint */
      background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 50%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em; /* TYPOGRAPHY: Slight letter tightening */
    }

    /* SUBTITLE: Secondary header text */
    .header .subtitle {
      font-size: 1.1rem;
      color: #64748b; /* TEXT: Muted color for less emphasis */
      font-weight: 400;
    }

    /* BADGE: Small label/tag element
       - Uses cyan accent with low opacity background */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.1);    /* ACCENT: Cyan at 10% opacity */
      border: 1px solid rgba(56, 189, 248, 0.2); /* ACCENT: Cyan border at 20% */
      padding: 0.4rem 1rem;
      border-radius: 100px;    /* SHAPE: Fully rounded pill */
      font-size: 0.8rem;
      color: #38bdf8;          /* ACCENT: Cyan text */
      margin-bottom: 1.5rem;
    }

    /* BADGE LED: The pulsing dot before badge text
       - Mimics an LED indicator light */
    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #38bdf8;     /* ACCENT: Cyan LED color */
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    /* PULSE ANIMATION: For the LED effect */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* CONTENT PLACEHOLDER: Temporary box showing where content goes
       - This will be replaced with actual checklist items */
    .content-placeholder {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      color: #475569; /* TEXT: Dim placeholder color */
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .content-placeholder svg {
      width: 48px;
      height: 48px;
      stroke: #334155; /* TEXT: Faint icon color */
    }

    /* CORNER ACCENTS: Decorative bracket elements in corners */
    .corner-accent {
      position: absolute;
      width: 80px;
      height: 80px;
      pointer-events: none;
    }

    .corner-accent.top-left {
      top: 0;
      left: 0;
    }

    .corner-accent.bottom-right {
      bottom: 0;
      right: 0;
      transform: rotate(180deg); /* Flip to face the other corner */
    }
  </style>
</head>
<body>
  <div class="poster">
    
    <!-- =====================================================
         SVG BACKGROUND PATTERN
         =====================================================
         Contains: Circuit traces, nodes, geometric shapes, particles
         Modify: Adjust paths/positions to change circuit layout
         ===================================================== -->
    <svg class="svg-background" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- GRADIENT: Used for circuit traces - flows through all accent colors -->
        <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.3" />   <!-- ACCENT: Cyan -->
          <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.2" />  <!-- ACCENT: Purple -->
          <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.3" /> <!-- ACCENT: Mint -->
        </linearGradient>

        <!-- FILTER: Glow effect for circuit nodes -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- PATTERN: Dot grid background (like PCB pads) -->
        <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
          <circle cx="20" cy="20" r="1" fill="rgba(148, 163, 184, 0.15)"/> <!-- Subtle gray dots -->
        </pattern>

        <!-- SYMBOL: Reusable circuit node (solder point)
             - Outer ring + inner filled dot -->
        <symbol id="node" viewBox="0 0 20 20">
          <circle cx="10" cy="10" r="4" fill="none" stroke="url(#traceGradient)" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="1.5" fill="#38bdf8" opacity="0.6"/> <!-- ACCENT: Cyan center -->
        </symbol>
      </defs>

      <!-- DOT GRID: Background pattern layer -->
      <rect width="100%" height="100%" fill="url(#dots)"/>

      <!-- =====================================================
           CIRCUIT TRACES: Decorative PCB-style lines
           - Each path is a separate "wire"
           - Coordinates: M = move to, L = line to
           - Adjust coordinates to reposition traces
           ===================================================== -->
      <g stroke="url(#traceGradient)" stroke-width="1" fill="none" opacity="0.5">
        <!-- TOP LEFT CLUSTER -->
        <path d="M 0 150 L 80 150 L 80 80 L 150 80"/>
        <path d="M 150 80 L 150 40"/>
        <path d="M 80 150 L 80 200 L 40 200"/>
        
        <!-- TOP RIGHT CLUSTER -->
        <path d="M 800 100 L 700 100 L 700 180 L 620 180"/>
        <path d="M 700 100 L 700 50"/>
        <path d="M 620 180 L 620 250 L 580 250"/>
        
        <!-- MIDDLE LEFT CLUSTER -->
        <path d="M 0 450 L 60 450 L 60 380 L 120 380 L 120 420"/>
        <path d="M 60 450 L 60 520 L 100 520"/>
        
        <!-- MIDDLE RIGHT CLUSTER -->
        <path d="M 800 500 L 720 500 L 720 440 L 680 440"/>
        <path d="M 720 500 L 720 580"/>
        
        <!-- BOTTOM LEFT CLUSTER -->
        <path d="M 50 900 L 50 850 L 120 850 L 120 800"/>
        <path d="M 120 850 L 180 850 L 180 900 L 180 950"/>
        
        <!-- BOTTOM RIGHT CLUSTER -->
        <path d="M 750 850 L 750 780 L 680 780 L 680 820"/>
        <path d="M 680 780 L 620 780 L 620 850"/>
        <path d="M 750 850 L 750 920 L 700 920"/>
      </g>

      <!-- =====================================================
           CIRCUIT NODES: Glowing solder points at intersections
           - Position with x, y attributes (offset by -10 to center)
           - Uses the "node" symbol defined above
           ===================================================== -->
      <g filter="url(#glow)">
        <!-- TOP LEFT NODES -->
        <use href="#node" x="70" y="140" width="20" height="20"/>
        <use href="#node" x="140" y="70" width="20" height="20"/>
        <use href="#node" x="70" y="190" width="20" height="20"/>
        
        <!-- TOP RIGHT NODES -->
        <use href="#node" x="690" y="90" width="20" height="20"/>
        <use href="#node" x="610" y="170" width="20" height="20"/>
        <use href="#node" x="610" y="240" width="20" height="20"/>
        
        <!-- MIDDLE NODES -->
        <use href="#node" x="50" y="440" width="20" height="20"/>
        <use href="#node" x="110" y="370" width="20" height="20"/>
        <use href="#node" x="710" y="490" width="20" height="20"/>
        <use href="#node" x="670" y="430" width="20" height="20"/>
        
        <!-- BOTTOM NODES -->
        <use href="#node" x="110" y="840" width="20" height="20"/>
        <use href="#node" x="170" y="840" width="20" height="20"/>
        <use href="#node" x="670" y="770" width="20" height="20"/>
        <use href="#node" x="740" y="840" width="20" height="20"/>
      </g>

      <!-- =====================================================
           DECORATIVE SHAPES: Playful geometric accents
           - Hexagon, rotated squares, triangles
           - Low opacity (0.15) for subtle effect
           ===================================================== -->
      <g opacity="0.15">
        <!-- HEXAGON: Top center accent -->
        <polygon points="400,30 430,47 430,83 400,100 370,83 370,47" 
                 fill="none" stroke="#a78bfa" stroke-width="1"/> <!-- ACCENT: Purple -->
        
        <!-- ROTATED SQUARES: Scattered diamond shapes -->
        <rect x="200" y="120" width="12" height="12" rx="2" 
              fill="none" stroke="#38bdf8" stroke-width="1" transform="rotate(45 206 126)"/> <!-- ACCENT: Cyan -->
        <rect x="600" y="300" width="12" height="12" rx="2" 
              fill="none" stroke="#34d399" stroke-width="1" transform="rotate(45 606 306)"/> <!-- ACCENT: Mint -->
        <rect x="150" y="600" width="12" height="12" rx="2" 
              fill="none" stroke="#a78bfa" stroke-width="1" transform="rotate(45 156 606)"/> <!-- ACCENT: Purple -->
        <rect x="650" y="650" width="12" height="12" rx="2" 
              fill="none" stroke="#38bdf8" stroke-width="1" transform="rotate(45 656 656)"/> <!-- ACCENT: Cyan -->
        
        <!-- TRIANGLES: Small arrow-like accents -->
        <polygon points="250,950 265,920 235,920" fill="none" stroke="#34d399" stroke-width="1"/> <!-- ACCENT: Mint -->
        <polygon points="550,80 565,50 535,50" fill="none" stroke="#38bdf8" stroke-width="1"/>   <!-- ACCENT: Cyan -->
      </g>

      <!-- =====================================================
           FLOATING PARTICLES: Tiny dots for depth/atmosphere
           - Uses cyan accent color at various opacities
           ===================================================== -->
      <g fill="#38bdf8"> <!-- ACCENT: Cyan particles -->
        <circle cx="300" cy="200" r="2" opacity="0.3"/>
        <circle cx="500" cy="400" r="1.5" opacity="0.2"/>
        <circle cx="180" cy="500" r="2" opacity="0.25"/>
        <circle cx="620" cy="550" r="1.5" opacity="0.2"/>
        <circle cx="350" cy="750" r="2" opacity="0.3"/>
        <circle cx="480" cy="850" r="1.5" opacity="0.25"/>
      </g>
    </svg>

    <!-- GRADIENT OVERLAY: Colored light effects (defined in CSS) -->
    <div class="gradient-overlay"></div>

    <!-- =====================================================
         CORNER ACCENTS: Decorative L-shaped brackets
         - Top-left uses cyan accent
         - Bottom-right uses purple accent (rotated 180°)
         ===================================================== -->
    <svg class="corner-accent top-left" viewBox="0 0 80 80">
      <path d="M 0 20 L 20 20 L 20 0" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/> <!-- ACCENT: Cyan -->
      <circle cx="20" cy="20" r="3" fill="#38bdf8" opacity="0.5"/>
    </svg>
    <svg class="corner-accent bottom-right" viewBox="0 0 80 80">
      <path d="M 0 20 L 20 20 L 20 0" fill="none" stroke="rgba(167, 139, 250, 0.3)" stroke-width="2"/> <!-- ACCENT: Purple -->
      <circle cx="20" cy="20" r="3" fill="#a78bfa" opacity="0.5"/>
    </svg>

    <!-- =====================================================
         CONTENT AREA
         =====================================================
         This is where the actual poster content goes.
         Replace .content-placeholder with checklist sections.
         ===================================================== -->
    <div class="content">
      <!-- HEADER: Badge + Title + Subtitle -->
      <div class="header">
        <div class="badge">Workshop Checklist</div>
        <h1>Electronics Workshop</h1>
        <p class="subtitle">Quality Assurance & Error Prevention</p>
      </div>

      <!-- PLACEHOLDER: Will be replaced with actual checklist content -->
      <div class="content-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" />
        </svg>
        <p>Your checklist content goes here</p>
        <p style="font-size: 0.85rem;">Share your content and we'll build the interactive checklist</p>
      </div>
    </div>
  </div>
</body>
</html>
