<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3d4d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ledGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1321"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">WS2812 LED Wiring Diagram</text>

  <!-- Arduino Board -->
  <rect x="80" y="100" width="180" height="220" rx="8" fill="url(#boardGradient)" stroke="#2d8a9e" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Arduino Uno</text>

  <!-- Arduino USB Port -->
  <rect x="140" y="85" width="60" height="20" rx="3" fill="#4a5568"/>
  <text x="170" y="78" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">USB</text>

  <!-- Arduino Pins -->
  <!-- 5V Pin -->
  <rect x="240" y="160" width="20" height="12" fill="#ef4444"/>
  <text x="235" y="168" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">5V</text>

  <!-- GND Pin -->
  <rect x="240" y="190" width="20" height="12" fill="#e2e8f0"/>
  <text x="235" y="198" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">GND</text>

  <!-- Pin 6 -->
  <rect x="240" y="220" width="20" height="12" fill="#22c55e"/>
  <text x="235" y="228" text-anchor="end" fill="#e2e8f0" font-family="monospace" font-size="11">D6</text>

  <!-- Arduino chip representation -->
  <rect x="130" y="180" width="80" height="100" rx="4" fill="#1a1a2e" stroke="#374151" stroke-width="1"/>
  <text x="170" y="235" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">ATmega328</text>

  <!-- LED Strip -->
  <rect x="480" y="120" width="240" height="180" rx="8" fill="url(#ledGradient)" stroke="#374151" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">WS2812 LED Strip</text>

  <!-- Direction Arrow on strip -->
  <path d="M 500 290 L 700 290 L 690 280 M 700 290 L 690 300" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <text x="600" y="308" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Data Direction</text>

  <!-- LED pixels -->
  <circle cx="570" cy="210" r="18" fill="#0f0f23" stroke="#374151" stroke-width="1"/>
  <circle cx="570" cy="210" r="12" fill="#22c55e" filter="url(#glow)"/>

  <circle cx="620" cy="210" r="18" fill="#0f0f23" stroke="#374151" stroke-width="1"/>
  <circle cx="620" cy="210" r="12" fill="#3b82f6" filter="url(#glow)"/>

  <circle cx="670" cy="210" r="18" fill="#0f0f23" stroke="#374151" stroke-width="1"/>
  <circle cx="670" cy="210" r="12" fill="#a855f7" filter="url(#glow)"/>

  <!-- LED Strip Input Pads -->
  <rect x="480" y="165" width="8" height="15" fill="#ef4444"/>
  <text x="495" y="175" text-anchor="start" fill="#fca5a5" font-family="monospace" font-size="10">5V</text>

  <rect x="480" y="195" width="8" height="15" fill="#e2e8f0"/>
  <text x="495" y="205" text-anchor="start" fill="#94a3b8" font-family="monospace" font-size="10">GND</text>

  <rect x="480" y="225" width="8" height="15" fill="#22c55e"/>
  <text x="495" y="235" text-anchor="start" fill="#fde047" font-family="monospace" font-size="10">DIN</text>

  <!-- Wires -->
  <!-- 5V Wire (Red) -->
  <path d="M 260 166 Q 370 166 370 172 L 370 172 Q 370 172 480 172"
        stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- GND Wire (White) -->
  <path d="M 260 196 Q 390 196 390 202 L 390 202 Q 390 202 480 202"
        stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Data Wire (Green) -->
  <path d="M 260 226 Q 410 226 410 232 L 410 232 Q 410 232 480 232"
        stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Legend -->
  <rect x="80" y="340" width="640" height="50" rx="6" fill="#1a2332" stroke="#374151" stroke-width="1"/>

  <line x1="100" y1="365" x2="140" y2="365" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="369" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">5V (Power)</text>

  <line x1="270" y1="365" x2="310" y2="365" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="369" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">GND (Ground)</text>

  <line x1="450" y1="365" x2="490" y2="365" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <text x="500" y="369" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Data (Pin 6) - Green</text>

  <!-- Warning about direction -->
  <text x="600" y="260" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Check arrow on strip!</text>
</svg>
