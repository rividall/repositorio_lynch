<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Background -->
  <rect width="700" height="450" fill="#0d1321"/>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">Vibe Coding</text>
  <text x="350" y="65" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="14">Your AI-Assisted Secret Weapon</text>

  <!-- Left side: Struggling coder -->
  <rect x="40" y="100" width="260" height="280" rx="12" fill="#1a2332" stroke="#374151" stroke-width="1"/>

  <!-- Sad face / struggling -->
  <circle cx="170" cy="200" r="50" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="150" cy="185" r="6" fill="#64748b"/>
  <circle cx="190" cy="185" r="6" fill="#64748b"/>
  <path d="M 145 225 Q 170 210 195 225" stroke="#64748b" stroke-width="3" fill="none"/>

  <!-- Sweat drops -->
  <ellipse cx="225" cy="175" rx="5" ry="8" fill="#38bdf8" opacity="0.5"/>
  <ellipse cx="235" cy="190" rx="4" ry="6" fill="#38bdf8" opacity="0.4"/>

  <!-- Code snippets floating around (confused) -->
  <text x="55" y="290" fill="#f87171" font-family="monospace" font-size="10" opacity="0.7">for(int i=0; i&lt;???</text>
  <text x="160" y="310" fill="#f87171" font-family="monospace" font-size="10" opacity="0.7">CRGB??? CHSV???</text>
  <text x="60" y="330" fill="#f87171" font-family="monospace" font-size="10" opacity="0.7">FastLED.????()</text>
  <text x="150" y="350" fill="#f87171" font-family="monospace" font-size="10" opacity="0.7">syntax error :(</text>

  <text x="170" y="395" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Memorizing syntax"</text>

  <!-- Arrow in middle -->
  <path d="M 320 240 L 360 240" stroke="#34d399" stroke-width="4" fill="none"/>
  <polygon points="360,230 380,240 360,250" fill="#34d399"/>

  <!-- Right side: Happy vibe coder -->
  <rect x="400" y="100" width="260" height="280" rx="12" fill="#1a2332" stroke="#34d399" stroke-width="2"/>

  <!-- Happy face -->
  <circle cx="490" cy="180" r="50" fill="none" stroke="#34d399" stroke-width="3"/>
  <circle cx="470" cy="165" r="6" fill="#34d399"/>
  <circle cx="510" cy="165" r="6" fill="#34d399"/>
  <path d="M 465 195 Q 490 220 515 195" stroke="#34d399" stroke-width="3" fill="none"/>

  <!-- Sunglasses (cool) -->
  <rect x="460" y="158" width="25" height="12" rx="3" fill="#1a1a1a" stroke="#34d399" stroke-width="1"/>
  <rect x="495" y="158" width="25" height="12" rx="3" fill="#1a1a1a" stroke="#34d399" stroke-width="1"/>
  <line x1="485" y1="164" x2="495" y2="164" stroke="#34d399" stroke-width="2"/>

  <!-- Sparkles -->
  <text x="550" y="150" fill="#fbbf24" font-size="20">✨</text>
  <text x="420" y="160" fill="#fbbf24" font-size="16">✨</text>
  <text x="560" y="200" fill="#fbbf24" font-size="14">✨</text>

  <!-- Chat bubble with AI -->
  <rect x="545" y="120" width="100" height="50" rx="8" fill="#a78bfa" opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
  <text x="595" y="142" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11">🤖 Claude</text>
  <text x="595" y="158" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="9">Here's your code!</text>

  <!-- Clean code output -->
  <rect x="415" y="250" width="230" height="100" rx="6" fill="#0d1321" stroke="#34d399" stroke-width="1"/>
  <text x="425" y="272" fill="#34d399" font-family="monospace" font-size="10">// Perfect rainbow effect</text>
  <text x="425" y="290" fill="#e2e8f0" font-family="monospace" font-size="10">for(int i=0; i&lt;NUM_LEDS; i++){</text>
  <text x="425" y="308" fill="#e2e8f0" font-family="monospace" font-size="10">  leds[i] = CHSV(hue+i*10,</text>
  <text x="425" y="326" fill="#e2e8f0" font-family="monospace" font-size="10">                 255, 255);</text>
  <text x="425" y="344" fill="#e2e8f0" font-family="monospace" font-size="10">}</text>

  <text x="530" y="395" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Describing what you want"</text>

  <!-- Bottom tagline -->
  <rect x="150" y="410" width="400" height="30" rx="15" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1"/>
  <text x="350" y="430" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14">Know what's possible → Ask clearly → Iterate! 🚀</text>

</svg>
