<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="boardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7f8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5a66;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1321"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Arduino Uno Pin Reference</text>

  <!-- Simplified Board -->
  <rect x="200" y="100" width="400" height="300" rx="10" fill="url(#boardGrad2)" stroke="#2d9aaa" stroke-width="2"/>

  <!-- USB Port -->
  <rect x="200" y="180" width="35" height="60" rx="3" fill="#4a5568"/>

  <!-- ATmega chip -->
  <rect x="340" y="200" width="120" height="100" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">ATmega328P</text>

  <!-- ============ DIGITAL PINS (TOP) ============ -->
  <rect x="250" y="105" width="300" height="18" rx="2" fill="#1a1a1a"/>

  <!-- Pin boxes with labels above -->
  <!-- D0 RX -->
  <rect x="260" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="267" y="85" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D0</text>
  <text x="267" y="95" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">RX</text>

  <!-- D1 TX -->
  <rect x="280" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="287" y="85" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D1</text>
  <text x="287" y="95" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">TX</text>

  <!-- D2 -->
  <rect x="300" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="307" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D2</text>

  <!-- D3 PWM -->
  <rect x="320" y="108" width="14" height="12" rx="1" fill="#34d399"/>
  <text x="327" y="85" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">D3</text>
  <text x="327" y="95" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7">~PWM</text>

  <!-- D4 -->
  <rect x="340" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="347" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D4</text>

  <!-- D5 PWM -->
  <rect x="360" y="108" width="14" height="12" rx="1" fill="#34d399"/>
  <text x="367" y="85" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">D5</text>
  <text x="367" y="95" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7">~PWM</text>

  <!-- D6 PWM - DATA PIN FOR LEDs! -->
  <rect x="380" y="108" width="14" height="12" rx="1" fill="#f87171"/>
  <text x="387" y="85" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="9" font-weight="bold">D6</text>
  <text x="387" y="95" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="7">~LED!</text>

  <!-- D7 -->
  <rect x="400" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="407" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D7</text>

  <!-- D8 -->
  <rect x="420" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="427" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D8</text>

  <!-- D9 PWM -->
  <rect x="440" y="108" width="14" height="12" rx="1" fill="#34d399"/>
  <text x="447" y="85" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">D9</text>
  <text x="447" y="95" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7">~PWM</text>

  <!-- D10 PWM -->
  <rect x="460" y="108" width="14" height="12" rx="1" fill="#34d399"/>
  <text x="467" y="85" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">D10</text>
  <text x="467" y="95" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7">~PWM</text>

  <!-- D11 PWM -->
  <rect x="480" y="108" width="14" height="12" rx="1" fill="#34d399"/>
  <text x="487" y="85" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">D11</text>
  <text x="487" y="95" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="7">~PWM</text>

  <!-- D12 -->
  <rect x="500" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="507" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D12</text>

  <!-- D13 -->
  <rect x="520" y="108" width="14" height="12" rx="1" fill="#fbbf24"/>
  <text x="527" y="90" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">D13</text>

  <!-- ============ ANALOG PINS (BOTTOM LEFT) ============ -->
  <rect x="250" y="377" width="140" height="18" rx="2" fill="#1a1a1a"/>

  <!-- A0-A5 -->
  <rect x="260" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="267" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A0</text>

  <rect x="280" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="287" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A1</text>

  <rect x="300" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="307" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A2</text>

  <rect x="320" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="327" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A3</text>

  <rect x="340" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="347" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A4</text>

  <rect x="360" y="380" width="14" height="12" rx="1" fill="#a78bfa"/>
  <text x="367" y="415" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="bold">A5</text>

  <!-- ============ POWER PINS (BOTTOM RIGHT) ============ -->
  <rect x="420" y="377" width="130" height="18" rx="2" fill="#1a1a1a"/>

  <rect x="430" y="380" width="14" height="12" rx="1" fill="#ef4444"/>
  <text x="437" y="415" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">5V</text>

  <rect x="450" y="380" width="14" height="12" rx="1" fill="#fb923c"/>
  <text x="457" y="415" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="9" font-weight="bold">3.3V</text>

  <rect x="475" y="380" width="14" height="12" rx="1" fill="#64748b"/>
  <text x="482" y="415" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9" font-weight="bold">GND</text>

  <rect x="495" y="380" width="14" height="12" rx="1" fill="#64748b"/>
  <text x="502" y="415" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9" font-weight="bold">GND</text>

  <rect x="520" y="380" width="14" height="12" rx="1" fill="#ef4444"/>
  <text x="527" y="415" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">Vin</text>

  <!-- ============ LEGEND ============ -->
  <rect x="50" y="440" width="700" height="50" rx="6" fill="#1a2332" stroke="#374151" stroke-width="1"/>

  <rect x="70" y="455" width="20" height="14" rx="2" fill="#fbbf24"/>
  <text x="100" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Digital I/O</text>

  <rect x="190" y="455" width="20" height="14" rx="2" fill="#34d399"/>
  <text x="220" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">PWM (~)</text>

  <rect x="295" y="455" width="20" height="14" rx="2" fill="#a78bfa"/>
  <text x="325" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Analog In</text>

  <rect x="410" y="455" width="20" height="14" rx="2" fill="#ef4444"/>
  <text x="440" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Power</text>

  <rect x="505" y="455" width="20" height="14" rx="2" fill="#64748b"/>
  <text x="535" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Ground</text>

  <rect x="610" y="455" width="20" height="14" rx="2" fill="#f87171"/>
  <text x="640" y="466" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">LED Data!</text>

  <!-- Callout for Pin 6 -->
  <path d="M 387 125 L 387 145 L 170 145 L 170 165" stroke="#f87171" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <rect x="80" y="165" width="180" height="40" rx="6" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="1"/>
  <text x="170" y="182" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pin 6 = LED Data Wire</text>
  <text x="170" y="197" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">Use this for WS2812!</text>

  <!-- Callout for Analog -->
  <rect x="620" y="330" width="150" height="55" rx="6" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="695" y="350" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Analog Pins</text>
  <text x="695" y="365" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="10">Read sensors!</text>
  <text x="695" y="378" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Values: 0-1023</text>

</svg>
