<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7f8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5a66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="500" fill="#0d1321"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">Arduino Uno</text>

  <!-- Main Board -->
  <rect x="100" y="70" width="500" height="380" rx="12" fill="url(#boardGrad)" stroke="#2d9aaa" stroke-width="3"/>

  <!-- Mounting holes -->
  <circle cx="130" cy="100" r="8" fill="#0d1321" stroke="#1a5f6e" stroke-width="2"/>
  <circle cx="570" cy="100" r="8" fill="#0d1321" stroke="#1a5f6e" stroke-width="2"/>
  <circle cx="130" cy="420" r="8" fill="#0d1321" stroke="#1a5f6e" stroke-width="2"/>
  <circle cx="570" cy="420" r="8" fill="#0d1321" stroke="#1a5f6e" stroke-width="2"/>

  <!-- USB Port -->
  <rect x="100" y="160" width="50" height="80" rx="4" fill="#4a5568"/>
  <rect x="100" y="175" width="40" height="50" rx="2" fill="#2d3748"/>
  <text x="75" y="205" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">USB-B</text>

  <!-- Power Jack -->
  <rect x="100" y="280" width="45" height="50" rx="20" fill="#2d3748"/>
  <circle cx="122" cy="305" r="8" fill="#1a202c"/>
  <text x="75" y="310" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Power</text>

  <!-- Main ATmega328 Chip -->
  <rect x="280" y="200" width="140" height="120" rx="4" fill="url(#chipGrad)" stroke="#444" stroke-width="1"/>
  <!-- Chip pins left -->
  <g fill="#888">
    <rect x="268" y="215" width="12" height="4"/>
    <rect x="268" y="230" width="12" height="4"/>
    <rect x="268" y="245" width="12" height="4"/>
    <rect x="268" y="260" width="12" height="4"/>
    <rect x="268" y="275" width="12" height="4"/>
    <rect x="268" y="290" width="12" height="4"/>
    <rect x="268" y="305" width="12" height="4"/>
  </g>
  <!-- Chip pins right -->
  <g fill="#888">
    <rect x="420" y="215" width="12" height="4"/>
    <rect x="420" y="230" width="12" height="4"/>
    <rect x="420" y="245" width="12" height="4"/>
    <rect x="420" y="260" width="12" height="4"/>
    <rect x="420" y="275" width="12" height="4"/>
    <rect x="420" y="290" width="12" height="4"/>
    <rect x="420" y="305" width="12" height="4"/>
  </g>
  <!-- Chip label -->
  <text x="350" y="255" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">ATmega328P</text>
  <text x="350" y="275" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">Microcontroller</text>
  <!-- Notch -->
  <circle cx="350" cy="208" r="6" fill="#222"/>

  <!-- Crystal oscillator -->
  <rect x="230" y="250" width="25" height="10" rx="2" fill="#c0c0c0" stroke="#888" stroke-width="1"/>
  <text x="242" y="275" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">16MHz</text>

  <!-- Reset button -->
  <rect x="200" y="130" width="30" height="20" rx="3" fill="#4a5568"/>
  <rect x="207" y="135" width="16" height="10" rx="2" fill="#718096"/>
  <text x="215" y="165" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">RESET</text>

  <!-- LEDs -->
  <circle cx="470" y="150" r="6" fill="#34d399" opacity="0.8"/>
  <text x="485" y="153" fill="#34d399" font-family="system-ui, sans-serif" font-size="9">ON</text>
  <circle cx="470" cy="170" r="6" fill="#fbbf24" opacity="0.6"/>
  <text x="485" y="173" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9">TX</text>
  <circle cx="470" cy="190" r="6" fill="#fbbf24" opacity="0.6"/>
  <text x="485" y="193" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9">RX</text>
  <circle cx="470" cy="210" r="6" fill="#f87171" opacity="0.6"/>
  <text x="485" y="213" fill="#f87171" font-family="system-ui, sans-serif" font-size="9">L (13)</text>

  <!-- Digital Pin Headers (top) -->
  <rect x="180" y="80" width="380" height="22" rx="3" fill="#1a1a1a"/>
  <g fill="#fbbf24">
    <rect x="190" y="85" width="8" height="12" rx="1"/>
    <rect x="205" y="85" width="8" height="12" rx="1"/>
    <rect x="220" y="85" width="8" height="12" rx="1"/>
    <rect x="235" y="85" width="8" height="12" rx="1"/>
    <rect x="250" y="85" width="8" height="12" rx="1"/>
    <rect x="265" y="85" width="8" height="12" rx="1"/>
    <rect x="280" y="85" width="8" height="12" rx="1"/>
    <rect x="295" y="85" width="8" height="12" rx="1"/>
    <rect x="325" y="85" width="8" height="12" rx="1"/>
    <rect x="340" y="85" width="8" height="12" rx="1"/>
    <rect x="355" y="85" width="8" height="12" rx="1"/>
    <rect x="370" y="85" width="8" height="12" rx="1"/>
    <rect x="385" y="85" width="8" height="12" rx="1"/>
    <rect x="400" y="85" width="8" height="12" rx="1"/>
    <rect x="430" y="85" width="8" height="12" rx="1"/>
    <rect x="445" y="85" width="8" height="12" rx="1"/>
    <rect x="460" y="85" width="8" height="12" rx="1"/>
    <rect x="475" y="85" width="8" height="12" rx="1"/>
    <rect x="490" y="85" width="8" height="12" rx="1"/>
    <rect x="505" y="85" width="8" height="12" rx="1"/>
    <rect x="535" y="85" width="8" height="12" rx="1"/>
  </g>
  <text x="350" y="118" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Digital Pins (0-13) + GND/AREF</text>

  <!-- Analog Pin Headers (bottom) -->
  <rect x="180" y="418" width="200" height="22" rx="3" fill="#1a1a1a"/>
  <g fill="#a78bfa">
    <rect x="190" y="423" width="8" height="12" rx="1"/>
    <rect x="210" y="423" width="8" height="12" rx="1"/>
    <rect x="230" y="423" width="8" height="12" rx="1"/>
    <rect x="250" y="423" width="8" height="12" rx="1"/>
    <rect x="270" y="423" width="8" height="12" rx="1"/>
    <rect x="290" y="423" width="8" height="12" rx="1"/>
    <rect x="320" y="423" width="8" height="12" rx="1"/>
    <rect x="340" y="423" width="8" height="12" rx="1"/>
    <rect x="360" y="423" width="8" height="12" rx="1"/>
  </g>
  <text x="280" y="410" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Analog Pins (A0-A5)</text>

  <!-- Power Headers (bottom right) -->
  <rect x="420" y="418" width="150" height="22" rx="3" fill="#1a1a1a"/>
  <g>
    <rect x="430" y="423" width="8" height="12" rx="1" fill="#ef4444"/>
    <rect x="450" y="423" width="8" height="12" rx="1" fill="#ef4444"/>
    <rect x="470" y="423" width="8" height="12" rx="1" fill="#94a3b8"/>
    <rect x="490" y="423" width="8" height="12" rx="1" fill="#94a3b8"/>
    <rect x="510" y="423" width="8" height="12" rx="1" fill="#38bdf8"/>
    <rect x="530" y="423" width="8" height="12" rx="1" fill="#38bdf8"/>
    <rect x="550" y="423" width="8" height="12" rx="1" fill="#34d399"/>
  </g>
  <text x="495" y="410" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Power (5V, 3.3V, GND, Vin)</text>

  <!-- Voltage regulator -->
  <rect x="160" y="350" width="40" height="30" rx="2" fill="#2d3748"/>
  <text x="180" y="395" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Regulator</text>

  <!-- ICSP Header -->
  <rect x="520" y="280" width="40" height="30" rx="2" fill="#1a1a1a"/>
  <g fill="#888">
    <circle cx="530" cy="290" r="3"/>
    <circle cx="545" cy="290" r="3"/>
    <circle cx="530" cy="300" r="3"/>
    <circle cx="545" cy="300" r="3"/>
  </g>
  <text x="540" y="325" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">ICSP</text>

  <!-- Legend -->
  <rect x="100" y="460" width="500" height="30" rx="4" fill="#1a2332"/>
  <circle cx="130" cy="475" r="5" fill="#fbbf24"/>
  <text x="145" y="479" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Digital</text>
  <circle cx="220" cy="475" r="5" fill="#a78bfa"/>
  <text x="235" y="479" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Analog</text>
  <circle cx="310" cy="475" r="5" fill="#ef4444"/>
  <text x="325" y="479" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Power</text>
  <circle cx="400" cy="475" r="5" fill="#94a3b8"/>
  <text x="415" y="479" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Ground</text>
  <circle cx="500" cy="475" r="5" fill="#38bdf8"/>
  <text x="515" y="479" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Other</text>

</svg>
