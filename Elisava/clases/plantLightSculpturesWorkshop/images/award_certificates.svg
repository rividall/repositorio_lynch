<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="500" fill="#0a0f1a"/>

  <!-- Certificate Border - outer -->
  <rect x="30" y="30" width="640" height="440" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Certificate Border - inner -->
  <rect x="45" y="45" width="610" height="410" rx="8" fill="url(#certGrad)" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>

  <!-- Corner decorations -->
  <g fill="#fbbf24" opacity="0.6">
    <!-- Top left -->
    <circle cx="60" cy="60" r="8"/>
    <circle cx="80" cy="60" r="4"/>
    <circle cx="60" cy="80" r="4"/>
    <!-- Top right -->
    <circle cx="640" cy="60" r="8"/>
    <circle cx="620" cy="60" r="4"/>
    <circle cx="640" cy="80" r="4"/>
    <!-- Bottom left -->
    <circle cx="60" cy="440" r="8"/>
    <circle cx="80" cy="440" r="4"/>
    <circle cx="60" cy="420" r="4"/>
    <!-- Bottom right -->
    <circle cx="640" cy="440" r="8"/>
    <circle cx="620" cy="440" r="4"/>
    <circle cx="640" cy="420" r="4"/>
  </g>

  <!-- Trophy Icon -->
  <g transform="translate(350, 90)" filter="url(#glow)">
    <text x="0" y="0" text-anchor="middle" font-size="50">🏆</text>
  </g>

  <!-- Workshop Title -->
  <text x="350" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" letter-spacing="4">PLANT LIGHT SCULPTURES WORKSHOP</text>

  <!-- Certificate Title -->
  <text x="350" y="190" text-anchor="middle" fill="#38bdf8" font-family="Georgia, serif" font-size="32" font-weight="bold">Certificate of Achievement</text>

  <!-- Decorative line -->
  <line x1="150" y1="210" x2="550" y2="210" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Award category placeholder -->
  <text x="350" y="260" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">🎨 Most Creative Design</text>

  <!-- "Awarded to" text -->
  <text x="350" y="300" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Awarded to</text>

  <!-- Name placeholder with underline -->
  <line x1="200" y1="345" x2="500" y2="345" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <text x="350" y="340" text-anchor="middle" fill="#e2e8f0" font-family="Georgia, serif" font-size="28" font-style="italic">[Student Name]</text>

  <!-- Description -->
  <text x="350" y="385" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">For outstanding achievement in the Plant Light Sculptures Workshop</text>
  <text x="350" y="405" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">ELISAVA School of Design and Engineering</text>

  <!-- Date and signature area -->
  <g>
    <!-- Date -->
    <line x1="120" y1="450" x2="280" y2="450" stroke="#374151" stroke-width="1"/>
    <text x="200" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Date</text>

    <!-- Signature -->
    <line x1="420" y1="450" x2="580" y2="450" stroke="#374151" stroke-width="1"/>
    <text x="500" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Instructor Signature</text>
  </g>

  <!-- Small decorative elements -->
  <g opacity="0.3">
    <circle cx="100" cy="250" r="30" fill="none" stroke="#38bdf8" stroke-width="0.5"/>
    <circle cx="600" cy="250" r="30" fill="none" stroke="#a78bfa" stroke-width="0.5"/>
    <circle cx="100" cy="250" r="20" fill="none" stroke="#38bdf8" stroke-width="0.5"/>
    <circle cx="600" cy="250" r="20" fill="none" stroke="#a78bfa" stroke-width="0.5"/>
  </g>

  <!-- Plant/LED motif in corners -->
  <text x="90" y="180" fill="#34d399" font-size="24" opacity="0.4">🌱</text>
  <text x="590" y="180" fill="#34d399" font-size="24" opacity="0.4">🌱</text>
  <text x="90" y="380" fill="#fbbf24" font-size="20" opacity="0.4">💡</text>
  <text x="600" y="380" fill="#fbbf24" font-size="20" opacity="0.4">💡</text>

</svg>
